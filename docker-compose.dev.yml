# docker-compose.dev.yml — Desarrollo local
# Uso: docker-compose -f docker-compose.dev.yml up
version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cryptogamer-backend-dev
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3001
    volumes:
      - ./backend/prisma:/app/prisma
      - ./backend/uploads:/app/uploads
    ports:
      - "3001:3001"
    networks:
      - dev_network

  frontend:
    image: node:20-alpine
    container_name: cryptogamer-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - dev_network

networks:
  dev_network:
    driver: bridge
